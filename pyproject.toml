[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsia-readmission"
version = "0.2.0"
description = "Proyecto II DSIA: calidad, prediccion de reingreso y resumen con IA"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
dsia = "readmission_app.cli:main"

[tool.setuptools]
packages = ["readmission_app", "ventas_app", "diabetes_app"]
package-dir = {ventas_app = "1_programacion_avanzada_python/ventas_app", diabetes_app = "1_programacion_avanzada_python/diabetes_app"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
