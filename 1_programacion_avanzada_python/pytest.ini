[pytest]
# Carpeta raíz que se añade al path, para poder hacer "from ventas_app import ..." en los tests
pythonpath = .

# Carpeta donde pytest busca los tests
testpaths = tests

# Registro de las marcas personalizadas (evita avisos de "unknown mark")
markers =
    integration: tests que leen ficheros reales del curso (más lentos)